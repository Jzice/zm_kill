# 持续集成：类型检查 → 构建双模式产物 → 校验单文件完整性
# 纯 Node 步骤，无需浏览器，可在每次 push / PR 秒级反馈
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / 构建 / 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 严格模式检查
        run: npm run typecheck

      - name: 构建 CDN 与 bundled 双模式产物
        run: npm run build

      - name: 校验产物为自包含单文件
        run: node scripts/verify-dist.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.html
          retention-days: 7
          if-no-files-found: error
