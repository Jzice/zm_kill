# 推送 v* 版本标签时自动发布 GitHub Release，并同步镜像到 Gitee Release
# 流程：类型检查 → 构建双模式产物 → 产物校验 → 准备发布资产 → 创建 GitHub Release 并上传 → 同步 Gitee Release（需 secrets.GITEE_TOKEN）
# 注：冒烟测试为发布后的质量反馈，在 headless CI 下偶发失败，设为非阻断（continue-on-error），避免环境抖动误杀发版。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.0.1），留空则用当前分支名'
        required: false
        type: string

permissions:
  contents: write # 创建 Release

# 同一标签的发布串行化，避免并发写 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发布规范：package.json 的 version 必须与标签一致。
      # 若发版时遗漏手动修改，这里自动回写为标签号并提交到 main，确保「发布即同步版本号」。
      - name: 同步 package.json 版本号到标签
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.version!=='$VER'){j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('package.json 版本已回写为 '+'$VER');}else{console.log('package.json 版本已为 '+'$VER');}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          # 仅当确有修改时才提交，避免重复空提交
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): 同步 package.json version 至 ${TAG}"
            git push origin HEAD:main
          fi

      - name: TypeScript 严格模式检查
        run: npm run typecheck

      - name: 构建 CDN 与 bundled 双模式产物
        run: npm run build

      - name: 校验产物为自包含单文件
        run: npm run verify:dist

      - name: 安装无头 Chromium（冒烟测试用）
        run: npx playwright install --with-deps chromium

      - name: 准备发布资产（ASCII 文件名，避免 GitHub 重命名为占位名）
        run: node scripts/stage-release.mjs

      - name: 创建 Release 并上传产物（发版核心步骤，先于冒烟执行）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 资产清单形如 "release/zhangmensha.html#中文说明"，gh 会把 # 后内容作为显示名
          mapfile -t ASSETS < release/assets.txt
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "release/assets.txt 为空，无法发布"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^zhangmensha\.bundled\.html$'; then
              echo "Release $TAG 已存在且资产命名正常，覆盖上传"
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              exit 0
            fi
            echo "Release $TAG 存在但资产命名异常（历史中文名被重命名），删除后重建"
            gh release delete "$TAG" --yes
          fi
          # 上一版本标签用于限定自动生成日志的范围；首个版本没有则留空
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" "${ASSETS[@]}" --title "掌门杀 $TAG" \
              --generate-notes --notes-start-tag "$PREV_TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "掌门杀 $TAG" --generate-notes
          fi

      # 以下冒烟为发布后的质量反馈，任一在 headless CI 下偶发失败均不阻断已创建的 Release
      - name: 单机冒烟测试（发布后校验，非阻断）
        continue-on-error: true
        run: npm run smoke

      - name: 技能系统冒烟测试（非阻断）
        continue-on-error: true
        run: npm run smoke:skills

      - name: 联机冒烟测试（非阻断）
        continue-on-error: true
        run: npm run smoke:net

      - name: 联机结算界面回归（非阻断）
        continue-on-error: true
        run: npm run smoke:net:settle

      - name: 卡牌扩展包冒烟测试（非阻断）
        continue-on-error: true
        run: npm run smoke:cards

      - name: 铁索连环·横置机制回归（非阻断）
        continue-on-error: true
        run: npm run smoke:tiesuo

      - name: 同步发布到 Gitee Release（镜像，非阻断）
        # 未配置 GITEE_TOKEN 时脚本内自动跳过；镜像失败也不回滚 GitHub 已发布的 Release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 镜像"
            exit 0
          fi
          cd release
          API="https://gitee.com/api/v5/repos/justice/zm_kill"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 幂等：标签对应的 Release 已存在则先删后建，避免重复附件
          RID=$(curl -sf "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            curl -sf -X DELETE "${API}/releases/${RID}?access_token=${GITEE_TOKEN}" || true
          fi
          RID=$(curl -sf -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"掌门杀 ${TAG}\",\"target_commitish\":\"main\",\"prerelease\":false,\"body\":\"自动同步自 GitHub Actions\"}" \
            | jq -r '.id')
          echo "Gitee release id = ${RID}"
          for f in zhangmensha.html zhangmensha.bundled.html; do
            curl -sf -X POST "${API}/releases/${RID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo "已上传 ${f}"
          done
